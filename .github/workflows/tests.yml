# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
# This file is based on https://github.com/haukex/my-py-template/blob/main/.github/workflows/tests.yml
name: Full Python Tests, Lint, and Coverage (all versions and OSes)
on:
  push:
    # only on commits, not on tags
    branches:
      - '**'
  pull_request:
jobs:
  tests:
    name: CPython ${{ matrix.python-version }} on ${{ matrix.os }}
    # Reminder: Keep in sync with dev/local-actions.sh
    strategy:
      fail-fast: false
      matrix:
        # Unfortunately, the Windows GH Action Runners can't run Linux Docker images.
        # Tests on my local machine show this package should work on Windows, though.
        # The macOS GH Action Runners apparently don't have Docker installed.
        # os: [Ubuntu, Windows, macOS]
        os: [Ubuntu]
        # Remember that some tests below only run on one version, so keep that up-to-date.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}-latest
    steps:
      - name: Disable autocrlf on Windows
        if: ${{ matrix.os == 'Windows' }}
        # https://github.com/actions/checkout/issues/135
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          # https://github.com/actions/setup-python#caching-packages-dependencies
          cache: pip
          cache-dependency-path: pyproject.toml
      # apt-cache showsrc python-ldap | grep Build-Depends
      - name: Install python-ldap build dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential debhelper-compat dh-python libldap2-dev libsasl2-dev python3-all-dbg python3-all-dev python3-doc python3-pyasn1-modules python3-setuptools python3-sphinx
      - name: Install dependencies
        run: make installdeps
      - name: Run checks and lint
        run: make smoke-checks ver-checks
      - name: Run nix-checks and shellcheck on Linux
        if: ${{ matrix.os == 'Ubuntu' }}
        # Only run nix-checks on Ubuntu because it doesn't work on Windows and bash is too old on macOS.
        # Only run shellcheck on Ubuntu because it's only installed there by default.
        run: make nix-checks shellcheck
      - name: Tests and Coverage
        run: make coverage
# spell-checker: ignore shellcheck installdeps pyproject